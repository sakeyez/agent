[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A minimal persistent Kimi CLI agent built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.5.1",
    "langchain-openai>=1.4.1",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langgraph>=1.2.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: sends a real request to the configured Kimi API",
]
